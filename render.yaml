# ═══════════════════════════════════════════════════════════════
#  APEX CREATIONS — render.yaml (Render Blueprint)
#  Deploy this entire file to Render for automatic setup.
#  Docs: https://render.com/docs/blueprint-spec
# ═══════════════════════════════════════════════════════════════

services:
  - type: web
    name: apex-creations
    env: node
    region: oregon
    plan: free                        # Change to 'starter' for always-on
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health

    # ── Render Persistent Disk (for uploaded images) ──────────
    disk:
      name: apex-uploads
      mountPath: /var/data/uploads
      sizeGB: 1                       # Increase as needed

    # ── Environment Variables ─────────────────────────────────
    # Set these in the Render Dashboard under Environment
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # ⚠️  Set these secrets in Render Dashboard manually:
      # - DATABASE_URL        → from your Render PostgreSQL
      # - JWT_SECRET          → long random string (64+ chars)
      # - ADMIN_USERNAME      → your admin username
      # - ADMIN_PASSWORD      → your strong admin password
      # - EMAIL_HOST          → smtp.gmail.com
      # - EMAIL_PORT          → 587
      # - EMAIL_USER          → callmetigger2018@gmail.com
      # - EMAIL_PASS          → Gmail App Password
      # - EMAIL_TO            → callmetigger2018@gmail.com
      # - FRONTEND_ORIGIN     → https://apex-creations.onrender.com

databases:
  - name: apex-db
    databaseName: apex_creations
    user: apex_user
    region: oregon
    plan: free
